<!doctype html>
<!--
  README Star animation source. Open directly to preview the 7-second loop;
  `node demo/media/star/render.mjs` renders it to demo/media/star-endo.gif.
  `?render` disables autoplay so the renderer can call `renderAt(seconds)`.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Endo Star</title>
    <link rel="stylesheet" href="../../../app/src/styles/fonts.css" />
    <style>
      :root {
        --canvas: #f6f8fa;
        --fg: #1f2328;
        --muted: #59636e;
        --border: #d1d9e0;
        --link: #0969da;
        --amber: #f5a623;
        --amber-edge: #d9890c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--canvas);
        font-family: Inter, system-ui, sans-serif;
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
      }

      svg {
        display: block;
        flex: none;
      }

      #stage {
        position: relative;
        width: 1000px;
        height: 420px;
        overflow: hidden;
        background: var(--canvas);
      }

      #camera {
        position: absolute;
        inset: 0;
        transform-origin: 0 0;
      }

      #card {
        position: absolute;
        top: 30px;
        left: 56px;
        right: 56px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: #fff;
        box-shadow:
          0 1px 0 rgb(31 35 40 / 4%),
          0 10px 28px rgb(31 35 40 / 6%);
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 28px 32px 0;
      }

      .repo {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 24px;
        letter-spacing: -0.01em;
        color: var(--link);
      }

      .avatar {
        width: 40px;
        height: 40px;
        padding: 5px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: #fff;
      }

      .avatar img {
        display: block;
        width: 100%;
        height: 100%;
      }

      .slash {
        margin: 0 7px;
        color: var(--muted);
      }

      .name {
        font-weight: 600;
      }

      .badge {
        padding: 2px 9px;
        border: 1px solid var(--border);
        border-radius: 999px;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0;
        color: var(--muted);
      }

      .actions {
        display: flex;
        gap: 10px;
      }

      .button {
        display: flex;
        align-items: stretch;
        height: 36px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #f6f8fa;
        font-size: 15px;
        font-weight: 500;
        color: var(--fg);
      }

      .button > span {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 14px;
      }

      .button svg {
        color: var(--muted);
      }

      .caret {
        border-left: 1px solid var(--border);
        padding: 0 10px !important;
      }

      .star-icon {
        position: relative;
      }

      #ring {
        position: absolute;
        inset: -9px;
        border: 2px solid var(--amber);
        border-radius: 50%;
        opacity: 0;
      }

      #label {
        position: relative;
        height: 20px;
      }

      #label > span {
        position: absolute;
        top: 0;
        left: 0;
        line-height: 20px;
        white-space: nowrap;
      }

      nav {
        display: flex;
        gap: 6px;
        margin-top: 22px;
        padding: 0 22px;
        border-bottom: 1px solid var(--border);
        font-size: 15px;
      }

      nav span {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 10px 13px;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
      }

      nav svg {
        color: var(--muted);
      }

      nav .selected {
        border-color: #fd8c73;
        font-weight: 600;
      }

      main {
        padding: 24px 32px 28px;
      }

      .about {
        margin: 0;
        font-size: 19px;
        font-weight: 500;
        letter-spacing: -0.005em;
      }

      .detail {
        margin: 6px 0 0;
        font-size: 16px;
        color: var(--muted);
      }

      .language {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 18px;
        font-size: 14px;
        color: var(--muted);
      }

      .language i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #3178c6;
      }

      #line {
        position: absolute;
        top: 336px;
        left: 0;
        right: 0;
        margin: 0;
        text-align: center;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: -0.015em;
        opacity: 0;
      }

      #cursor {
        position: absolute;
        top: 0;
        left: 0;
        transform-origin: 1.5px 1.5px;
        filter: drop-shadow(0 2px 3px rgb(0 0 0 / 28%));
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="camera">
        <section id="card">
          <header>
            <div class="repo">
              <span class="avatar"
                ><img src="../../../app/src/components/ui/brand/endo.png" alt=""
              /></span>
              <span
                >longsurf-ai<span class="slash">/</span
                ><span class="name">endo</span></span
              >
              <span class="badge">Public</span>
            </div>
            <div class="actions">
              <div class="button">
                <span>
                  <svg
                    width="16"
                    height="16"
                    viewBox="0 0 16 16"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                  >
                    <circle cx="4" cy="3" r="1.75" />
                    <circle cx="12" cy="3" r="1.75" />
                    <circle cx="8" cy="13" r="1.75" />
                    <path
                      d="M4 4.75v1a1.5 1.5 0 0 0 1.5 1.5h5a1.5 1.5 0 0 0 1.5-1.5v-1M8 7.25v4"
                    />
                  </svg>
                  Fork
                </span>
              </div>
              <div class="button" id="star">
                <span>
                  <span class="star-icon">
                    <i id="ring"></i>
                    <svg
                      id="star-svg"
                      width="16"
                      height="16"
                      viewBox="0 0 16 16"
                    >
                      <path
                        id="star-path"
                        d="M8 1.4 9.94 5.73 14.66 6.24 11.14 9.42 12.11 14.06 8 11.7 3.89 14.06 4.86 9.42 1.34 6.24 6.06 5.73Z"
                        fill="var(--amber)"
                        fill-opacity="0"
                        stroke="currentColor"
                        stroke-width="1.4"
                        stroke-linejoin="round"
                      />
                    </svg>
                  </span>
                  <span id="label"
                    ><span id="label-star">Star</span
                    ><span id="label-starred">Starred</span></span
                  >
                </span>
                <span class="caret">
                  <svg
                    width="16"
                    height="16"
                    viewBox="0 0 16 16"
                    fill="currentColor"
                  >
                    <path d="M4.5 6.5h7L8 10.3Z" />
                  </svg>
                </span>
              </div>
            </div>
          </header>
          <nav>
            <span class="selected">
              <svg
                width="16"
                height="16"
                viewBox="0 0 16 16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M5.5 4 1.75 8l3.75 4M10.5 4l3.75 4-3.75 4" />
              </svg>
              Code
            </span>
            <span>
              <svg
                width="16"
                height="16"
                viewBox="0 0 16 16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
              >
                <circle cx="8" cy="8" r="6.25" />
                <circle
                  cx="8"
                  cy="8"
                  r="1.25"
                  fill="currentColor"
                  stroke="none"
                />
              </svg>
              Issues
            </span>
            <span>
              <svg
                width="16"
                height="16"
                viewBox="0 0 16 16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="4" cy="3.5" r="1.75" />
                <circle cx="4" cy="12.5" r="1.75" />
                <circle cx="12" cy="12.5" r="1.75" />
                <path
                  d="M4 5.25v5.5M12 10.75V6.5a2 2 0 0 0-2-2H8M9.5 3 8 4.5 9.5 6"
                />
              </svg>
              Pull requests
            </span>
            <span>
              <svg
                width="16"
                height="16"
                viewBox="0 0 16 16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linejoin="round"
              >
                <circle cx="8" cy="8" r="6.25" />
                <path
                  d="M6.75 5.6 10.4 8l-3.65 2.4Z"
                  fill="currentColor"
                  stroke-width="1"
                />
              </svg>
              Actions
            </span>
          </nav>
          <main>
            <p class="about">The Higher Order Harness for every agent you use.</p>
            <p class="detail">
              Compose Codex, Claude Code and Antigravity in one desktop app.
            </p>
            <div class="language"><i></i>TypeScript</div>
          </main>
        </section>
        <svg id="cursor" width="22" height="30" viewBox="0 0 22 30">
          <path
            d="M1.5 1.5v21.6l5.4-5.2 3.7 8.5 3.7-1.6-3.6-8.3h7.4Z"
            fill="#111"
            stroke="#fff"
            stroke-width="1.6"
            stroke-linejoin="round"
          />
        </svg>
      </div>
      <p id="line">Build with us.</p>
    </div>
    <script>
      const DURATION = 7;
      const element = (id) => document.getElementById(id);
      const clamp = (x) => Math.min(1, Math.max(0, x));
      const progress = (t, start, end) => clamp((t - start) / (end - start));
      const inOut = (x) => (x < 0.5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2);
      const out = (x) => 1 - (1 - x) ** 3;
      const bump = (x) => Math.sin(Math.PI * x);
      const lerp = (a, b, k) => a + (b - a) * k;
      const rgb = (hex) =>
        [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
      const mix = (a, b, k) =>
        `rgb(${rgb(a).map((v, i) => Math.round(lerp(v, rgb(b)[i], k)))})`;

      let geometry;

      // Measures the resting layout once; the cursor path and label widths derive from it.
      function measure() {
        const star = element("label-star").offsetWidth;
        const starred = element("label-starred").offsetWidth;
        element("label").style.width = `${star}px`;
        const stage = element("stage").getBoundingClientRect();
        const icon = element("star-svg").getBoundingClientRect();
        const button = element("star").getBoundingClientRect();
        const target = {
          x: icon.right + 5 - stage.left,
          y: button.top + button.height / 2 + 2 - stage.top,
        };
        const start = { x: target.x - 330, y: 452 };
        geometry = {
          start,
          target,
          control: {
            x: lerp(start.x, target.x, 0.62),
            y: lerp(start.y, target.y, 0.62) + 70,
          },
          focus: {
            x: button.left + button.width / 2 - stage.left,
            y: button.top + button.height / 2 - stage.top,
          },
          star,
          starred,
        };
      }

      /** Draws the frame at `t` seconds; every visual value is a pure function of `t`. */
      function renderAt(t) {
        t = ((t % DURATION) + DURATION) % DURATION;
        const reset = t >= 6.3;
        // The card and cursor share one camera, keeping the click aligned during the close-up.
        const zoom =
          inOut(progress(t, 0.9, 2.2)) * (1 - inOut(progress(t, 3.6, 4.6)));
        const closeUpScale = 2.4;
        const scale = lerp(1, closeUpScale, zoom);
        const cameraX = (710 - geometry.focus.x * closeUpScale) * zoom;
        const cameraY = (180 - geometry.focus.y * closeUpScale) * zoom;
        element("camera").style.transform =
          `translate(${cameraX}px, ${cameraY}px) scale(${scale})`;
        // The card dips instead of vanishing; the starred state resets at the bottom of the dip.
        const dip = reset
          ? 1 - inOut(progress(t, 6.3, DURATION))
          : inOut(progress(t, 5.8, 6.3));
        element("card").style.opacity = 1 - 0.85 * dip;

        const filled = reset ? 0 : inOut(progress(t, 2.68, 2.86));
        const press = bump(progress(t, 2.58, 2.76));
        const hover = progress(t, 2.3, 2.45) * (1 - progress(t, 3.35, 3.55));
        element("star").style.background = mix(
          mix("#f6f8fa", "#eef1f4", hover),
          "#e4e8ec",
          press,
        );
        element("star-path").setAttribute("fill-opacity", filled);
        element("star-svg").style.color = mix("#59636e", "#d9890c", filled);
        element("star-svg").style.transform =
          `scale(${1 + 0.22 * bump(progress(t, 2.68, 3.02))})`;
        element("label").style.width =
          `${lerp(geometry.star, geometry.starred, filled)}px`;
        element("label-star").style.opacity = 1 - filled;
        element("label-starred").style.opacity = filled;

        const ring = reset ? 0 : progress(t, 2.68, 3.2);
        element("ring").style.opacity =
          ring > 0 && ring < 1 ? 0.45 * (1 - ring) : 0;
        element("ring").style.transform = `scale(${0.55 + 0.75 * out(ring)})`;

        const line = reset
          ? 0
          : out(progress(t, 4.6, 5.0)) * (1 - inOut(progress(t, 5.8, 6.15)));
        element("line").style.opacity = line;
        element("line").style.transform =
          `translateY(${(1 - out(progress(t, 4.6, 5.0))) * 8}px)`;

        const { start, control, target } = geometry;
        const p = inOut(progress(t, 1.2, 2.45));
        const drift = inOut(progress(t, 3.6, 4.6));
        const x =
          (1 - p) ** 2 * start.x +
          2 * (1 - p) * p * control.x +
          p ** 2 * target.x +
          26 * drift;
        const y =
          (1 - p) ** 2 * start.y +
          2 * (1 - p) * p * control.y +
          p ** 2 * target.y +
          92 * drift;
        const cursor = element("cursor");
        cursor.style.opacity = reset
          ? 0
          : out(progress(t, 1.2, 1.5)) * (1 - inOut(progress(t, 5.8, 6.1)));
        cursor.style.transform = `translate(${x - 1.5}px, ${y - 1.5}px) scale(${1 - 0.1 * press})`;
      }

      window.renderAt = renderAt;
      window.ready = Promise.all(
        ["400 16px Inter", "500 16px Inter", "600 16px Inter"].map((font) =>
          document.fonts.load(font),
        ),
      )
        .then(() => document.fonts.ready)
        .then(() => {
          measure();
          renderAt(0);
        });

      if (!new URLSearchParams(location.search).has("render")) {
        window.ready.then(() => {
          const origin = performance.now();
          const frame = (now) => {
            renderAt((now - origin) / 1000);
            requestAnimationFrame(frame);
          };
          requestAnimationFrame(frame);
        });
      }
    </script>
  </body>
</html>
